<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TipWall — wall of stacked coins">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FBF7EE" stroke="#171614" stroke-width="3"/>
  <!-- brick frame around a centered coin stack -->
  <g fill="#E9E2D2" stroke="#171614" stroke-width="2.2" stroke-linejoin="round">
    <rect x="6" y="6" width="20" height="14" rx="2"/>
    <rect x="26" y="6" width="20" height="14" rx="2"/>
    <rect x="46" y="6" width="12" height="14" rx="2"/>
    <rect x="6" y="20" width="12" height="14" rx="2"/>
    <rect x="46" y="20" width="12" height="14" rx="2"/>
    <rect x="6" y="34" width="20" height="14" rx="2"/>
    <rect x="26" y="34" width="20" height="14" rx="2"/>
    <rect x="46" y="34" width="12" height="14" rx="2"/>
    <rect x="6" y="48" width="20" height="10" rx="2"/>
    <rect x="26" y="48" width="20" height="10" rx="2"/>
    <rect x="46" y="48" width="12" height="10" rx="2"/>
  </g>
  <!-- cleared hole in the middle = a coin stack (3 coins, edges visible) -->
  <g>
    <!-- coin stack shadow -->
    <rect x="20" y="26" width="24" height="22" rx="3" fill="#171614" opacity="0.12"/>
    <!-- coin 1 (bottom) -->
    <ellipse cx="32" cy="42" rx="11" ry="4.5" fill="#F6B221" stroke="#171614" stroke-width="2"/>
    <rect x="21" y="38" width="22" height="4" fill="#F6B221" stroke="#171614" stroke-width="2"/>
    <!-- coin 2 -->
    <rect x="21" y="32" width="22" height="6" fill="#F6B221" stroke="#171614" stroke-width="2"/>
    <ellipse cx="32" cy="32" rx="11" ry="3" fill="#F6B221" stroke="#171614" stroke-width="2"/>
    <!-- coin 3 (top, smaller - in motion) -->
    <ellipse cx="32" cy="26" rx="10" ry="3.5" fill="#F6B221" stroke="#171614" stroke-width="2"/>
    <!-- bolt mark on top coin -->
    <path d="M33 23.5 L29.5 27.5 H32 L31 30 L34.5 26 H32.2 Z" fill="#171614"/>
  </g>
</svg>